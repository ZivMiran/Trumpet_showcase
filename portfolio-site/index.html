<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The tile, not the bare mark: gold-on-white in a light tab bar is a
         1.9:1 smudge, and the charcoal plate is the icon form anyway. -->
    <link rel="icon" type="image/svg+xml" href="/images/brand/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Trumpet — a music-analytics dashboard that turns scattered platform data into one clear artist decision. UX/UI course final project by Ziv Miran."
    />
    <meta name="color-scheme" content="dark" />

    <!-- Link preview. The deck is delivered as a URL in an email or a chat, so
         this card is the first thing anyone sees of it. Absolute URLs on
         purpose: crawlers don't resolve relative paths, and the og:image has to
         be a jpg — WebP support across previewers is still patchy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ziv Miran" />
    <meta property="og:title" content="Trumpet — a music-analytics dashboard" />
    <meta
      property="og:description"
      content="Turning scattered platform data into one clear artist decision. A UX/UI course final project: research, flow, design system, and a working prototype."
    />
    <meta
      property="og:image"
      content="https://zivmiran.github.io/Trumpet_showcase/og-cover.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Trumpet Overview screen: an insight sentence over five KPI cards and a streams chart."
    />
    <meta property="og:url" content="https://zivmiran.github.io/Trumpet_showcase/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Space Grotesk: preconnect + display=swap for fast first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    />

    <title>Trumpet — UX/UI Case Study · Ziv Miran</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
